<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 실패 - 붕어짱</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root {
            --bg-phone-wall: repeating-linear-gradient(90deg, #FDECCB, #FDECCB 37px, #FFF7E4 37px, #FFF7E4 74px);
            --app-main-amber: #D38E32;
            --app-dark-brown: #4A2B20;
            --text-main: #000000;
            --text-muted: #7A7A7A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: #F7B84B;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone-container {
            width: 393px;
            height: 852px;
            background: var(--bg-phone-wall);
            border: 12px solid var(--app-dark-brown);
            border-radius: 48px;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            padding: 44px 24px 20px 24px;
        }

        /* 상단 노치 */
        .phone-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 28px;
            background-color: var(--app-dark-brown);
            border-bottom-left-radius: 18px;
            border-bottom-right-radius: 18px;
            z-index: 20;
        }

        .fail-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            text-align: center;
        }

        .fail-badge {
            width: 80px;
            height: 80px;
            background-color: #E53935;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(229, 57, 53, 0.3);
            margin-bottom: 24px;
            animation: pop-in 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .fail-badge span {
            color: white;
            font-size: 48px;
        }

        .fail-title {
            font-size: 28px;
            font-weight: 900;
            color: var(--app-dark-brown);
            margin-bottom: 8px;
        }

        .fail-subtitle {
            font-size: 15px;
            font-weight: 500;
            color: #555;
            margin-bottom: 30px;
        }

        .error-card {
            background-color: white;
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            box-shadow: 0 8px 30px rgba(62, 39, 35, 0.05);
            border: 1.5px solid rgba(74, 43, 32, 0.08);
            margin-bottom: 35px;
            text-align: left;
            animation: fade-up 0.8s ease;
        }

        .error-card h3 {
            font-size: 16px;
            font-weight: 800;
            color: #E53935;
            border-bottom: 1px dashed rgba(0,0,0,0.1);
            padding-bottom: 12px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .error-item {
            display: flex;
            flex-direction: column;
            margin-bottom: 14px;
        }

        .error-item:last-child {
            margin-bottom: 0;
        }

        .error-label {
            color: var(--text-muted);
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .error-value {
            color: var(--text-main);
            font-weight: 500;
            font-size: 14px;
            word-break: break-all;
            background-color: #FAF5F2;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid rgba(0,0,0,0.03);
        }

        .btn-retry {
            width: 100%;
            padding: 16px;
            background-color: var(--app-main-amber);
            color: white;
            border: none;
            border-radius: 32px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(211,142,50,0.2);
            transition: all 0.2s;
        }

        .btn-retry:active {
            transform: scale(0.96);
            box-shadow: 0 3px 8px rgba(211,142,50,0.15);
        }

        .home-indicator {
            width: 140px;
            height: 5px;
            background-color: var(--app-dark-brown);
            border-radius: 100px;
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
        }

        @keyframes pop-in {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fade-up {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>

<body>
    <div class="phone-container">
        <div class="fail-content">
            <div class="fail-badge">
                <span class="material-icons-round">close</span>
            </div>
            <h1 class="fail-title">결제에 실패했습니다</h1>
            <p class="fail-subtitle">아래 원인을 확인하고 다시 시도해 주세요.</p>

            <div class="error-card">
                <h3><span>오류 정보</span> <span class="material-icons-round" style="color: #E53935;">warning</span></h3>
                <div class="error-item">
                    <span class="error-label">에러 코드</span>
                    <span class="error-value" id="errorCode">-</span>
                </div>
                <div class="error-item">
                    <span class="error-label">실패 사유</span>
                    <span class="error-value" id="errorMessage">-</span>
                </div>
            </div>

            <button class="btn-retry" onclick="goBack()">장바구니로 돌아가기</button>
        </div>
        <div class="home-indicator"></div>
    </div>

    <script>
        // URL의 쿼리 파라미터 파싱
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const message = urlParams.get('message');

        // 내역 표시
        if (code) document.getElementById('errorCode').textContent = code;
        if (message) document.getElementById('errorMessage').textContent = message;

        function goBack() {
            window.location.href = 'index.html?screen=scr-cart';
        }
    </script>
</body>

</html>
